<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Grievance Redressal Portal — A secure platform for students to submit, track, and resolve complaints across all departments.">
  <title>Student Grievance Portal</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a class="nav-logo" href="#/" onclick="navigate('/')">
        <div class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        SGR Portal
      </a>
      <button class="nav-hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="nav-links">
        <a class="nav-link active" data-route="/" href="#/" onclick="closeMobileMenu()">Home</a>
        <a class="nav-link" data-route="/submit" href="#/submit" onclick="closeMobileMenu()">Submit</a>
        <a class="nav-link" data-route="/track" href="#/track" onclick="closeMobileMenu()">Track</a>
        <a class="nav-link" data-route="/admin/login" href="#/admin/login" onclick="closeMobileMenu()">Admin</a>
      </div>
    </div>
  </nav>

  <!-- App Mount -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/submit.js"></script>
  <script src="/js/track.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
