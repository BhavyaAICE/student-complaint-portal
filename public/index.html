<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Student Grievance Redressal Portal — A secure platform for students to submit, track, and resolve complaints across all departments.">
  <title>Student Grievance Portal</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <nav class="navbar">

      <a class="nav-logo" href="#/" onclick="navigate('/')">

      <div class="nav-links">

    </div>
  </nav>

  <!-- App Mount -->
  <div id="app"></div>

  <!-- Scripts -->
  <script src="/js/icons.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/submit.js"></script>
